<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learnora. QR Generator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a8b3e1, #b592d7);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 320px;
            text-align: center;
            box-shadow:
                0 15px 30px rgba(0,0,0,0.2),
                0 5px 15px rgba(102,126,234,0.2);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: contain;
            background: white;
            padding: 8px;
            margin: 0 auto 15px;
            display: block;
            border: 3px solid rgba(0,0,0,0.2);
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);

            /* Floating animation */
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }

            100% {
                transform: translateY(0);
            }
        }

        h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #5e699a;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #7b8ad4;
        }

        #qrBox {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
    </style>
</head>
<body>

<div class="container">

    <img src="4aeccedc-308f-4771-af52-a0d49a836d5f-7.png"
         alt="Learnora Logo"
         class="logo">

    <h1>Learnora. QR</h1>

    <p>Convert text or URLs into QR codes</p>

    <input type="text" id="qrInput" placeholder="Enter text or URL">

    <button onclick="generateQR()">Generate QR</button>

    <div id="qrBox"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

<script>
function generateQR() {
    const qrBox = document.getElementById("qrBox");
    const text = document.getElementById("qrInput").value;

    qrBox.innerHTML = "";

    if (text.trim() === "") {
        alert("Please enter text or a URL.");
        return;
    }

    new QRCode(qrBox, {
        text: text,
        width: 160,
        height: 160
    });
}
</script>   
</body>
</html>
